<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>31 KPI Dashboard</title>
<link rel="stylesheet" href="../_pptx-slide.css"></head>
<body data-layout="kpi-grid">

<div style="position:absolute; top:42pt; left:56pt; right:56pt;">
  <div class="row between" style="align-items: flex-end;">

  </div>

</div>

      </div>
      <p class="t-cap c-secondary">경고 기준 <b style="color: {{TOKEN:colors.text}};">60점</b> 이하</p>

    <!-- KPI 2 -->
    <div class="card-accent" style="padding: 14pt 16pt;">
      <p class="t-cap-up c-accent" style="margin-bottom: 8pt;">매출 성장률</p>

      <div style="height: 6pt; background: {{TOKEN:colors.border}}; border-radius: 3pt; overflow: hidden; margin: 10pt 0;">

      <p style="font-size: 24pt; font-weight: 800; color: {{TOKEN:colors.warning}}; line-height: 1; letter-spacing: -0.6pt;">5.5<span style="font-size: 13pt;">회</span></p>

      <p style="font-size: 24pt; font-weight: 800; color: {{TOKEN:colors.negative}}; line-height: 1; letter-spacing: -0.6pt;">40<span style="font-size: 13pt;">%</span></p>

  <div class="card-alt" style="margin-top: 18pt; padding: 14pt 18pt;">

  </div>
</div>

<div class="gm-band">
  <p class="t-body c-secondary" style="font-weight: 700;">5개 지표 중 4개 안정 / 1개 주의 — 개선 포인트가 명확할 때 행동이 빠릅니다.</p>
